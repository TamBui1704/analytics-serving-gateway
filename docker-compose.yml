# ============================================================
# DOCKER COMPOSE DÀNH CHO NẤC 1 & NẤC 2
# ============================================================
# Cụm 3 container chạy trên cùng 1 mạng ảo (analytics_net):
#
#   Client (Postman/curl)
#           │
#           ▼ (Cổng 8080 - Nấc 2: API Gateway)
#    [ api_gateway (NGINX) ]  ← Chặn API Key & Rate Limit (5 r/s)
#           │
#           ▼ (Cổng 8000 nội bộ)
#    [ api_service (FastAPI) ] ← Xử lý logic, trả về JSON
#           │
#           ▼ (Cổng 8123 nội bộ)
#    [ clickhouse (OLAP DB) ]  ← Lưu trữ & tính toán 50.000 dòng orders
# ============================================================

services:
  # ── 1. DATA LAYER (ClickHouse) ──────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: analytics_clickhouse
    ports:
      - "127.0.0.1:8123:8123"   # Chỉ bind vào localhost, không mở ra toàn mạng (0.0.0.0) tránh hacker scan port
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - analytics_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── 2. APPLICATION LAYER (FastAPI App - Nấc 1) ─────────────
  api_service:
    build:
      context: .
      dockerfile: Dockerfile
    image: analytics-api:v1
    container_name: analytics_api
    # ports:
    #   - "8000:8000"
    # ↑ Bình luận dòng này lại khi deploy lên server thật!
    # Khi mở, cổng 8000 bị lộ ra ngoài NGINX → hacker bypass gateway, truy cập /docs, /openapi.json thoải mái.
    # Trên server thật: CHỈ mở cổng 8080 (NGINX). FastAPI chỉ nói chuyện nội bộ trong Docker network.
    # Khi dev local: bỏ bình luận để gọi thẳng FastAPI mà không qua NGINX (tiện debug).
    ports:
      - "127.0.0.1:8000:8000"   # Chỉ cho máy nội bộ (localhost) truy cập, không mở ra Internet
    environment:
      CLICKHOUSE_HOST: clickhouse   # Tên service của ClickHouse trong Docker network
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: analytics
      API_KEYS: "demo-key-123,demo-key-456"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080"
      WORKERS: 2                    # Chạy local: 2 process Uvicorn (image mặc định = 1 cho K8s)
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - analytics_net

  # ── 3. EDGE LAYER: API GATEWAY (NGINX - Nấc 2) ──────────────
  api_gateway:
    image: nginx:alpine
    container_name: analytics_gateway
    ports:
      - "8080:80"     # Cổng bạn gọi để đi qua API Gateway: http://localhost:8080
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api_service
    networks:
      - analytics_net

networks:
  analytics_net:
    driver: bridge

volumes:
  clickhouse_data:
    driver: local
