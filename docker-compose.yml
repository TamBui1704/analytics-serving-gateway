# ============================================================
# DOCKER COMPOSE DÀNH CHO NẤC 1 & NẤC 2 (PHƯƠNG ÁN A: TINH GỌN)
# ============================================================
# Cụm 3 container chạy trên cùng 1 mạng ảo (analytics_net):
#
#   Client (Postman/curl)
#           │
#           ▼ (Cổng 8080/8443 - Nấc 2: API Gateway)
#    [ api_gateway (NGINX) ]  ← HTTPS/SSL, Rate Limit, Điều hướng Subdomain
#           │
#           ▼ (Cổng 8000 nội bộ)
#    [ api_service (FastAPI) ] ← Tự thẩm định Timestamp + SHA256(key + timestamp)
#           │
#           ▼ (Cổng 8123 nội bộ)
#    [ clickhouse (OLAP DB) ]  ← Lưu trữ & tính toán 50.000 dòng orders
# ============================================================

services:
  # ── 1. DATA LAYER (ClickHouse) ──────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: analytics_clickhouse
    ports:
      - "127.0.0.1:8123:8123"   # Chỉ bind vào localhost, không mở ra toàn mạng (0.0.0.0) tránh hacker scan port
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - analytics_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── 2. APPLICATION LAYER (FastAPI App - Nấc 1) ─────────────
  api_service:
    build:
      context: .
      dockerfile: Dockerfile
    image: analytics-api:v1
    container_name: analytics_api
    ports:
      - "127.0.0.1:8000:8000"   # Chỉ cho máy nội bộ (localhost) truy cập, không mở ra Internet
    environment:
      CLICKHOUSE_HOST: clickhouse   # Tên service của ClickHouse trong Docker network
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: analytics
      # Phân quyền danh sách Key theo từng Service riêng biệt (Phương án A)
      ANALYTICS_API_KEYS: "key_user_a,key_user_vip,demo-key-123"
      BRANDING_API_KEYS: "key_user_b,key_user_vip"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,https://analytics.local:8443,https://branding.local:8443"
      WORKERS: 2                    # Chạy local: 2 process Uvicorn (image mặc định = 1 cho K8s)
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - analytics_net

  # ── 3. EDGE LAYER: API GATEWAY (NGINX - Nấc 2) ──────────────
  api_gateway:
    image: nginx:alpine
    container_name: analytics_gateway
    ports:
      - "8080:80"     # Cổng HTTP API Gateway: http://localhost:8080
      - "8443:443"    # Cổng HTTPS API Gateway (SSL/TLS): https://localhost:8443
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/certs:/etc/nginx/certs:ro
    depends_on:
      - api_service
    networks:
      - analytics_net

networks:
  analytics_net:
    driver: bridge

volumes:
  clickhouse_data:
    driver: local
