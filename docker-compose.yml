# docker-compose.yml — Local data layer (ClickHouse)
# Run: docker compose up -d
# ClickHouse HTTP API available at http://localhost:8123

version: "3.9"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: analytics_clickhouse
    ports:
      - "8123:8123"   # HTTP interface (used by clickhouse-connect)
      - "9000:9000"   # Native protocol (optional, for ClickHouse CLI)
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""   # Empty password for local dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clickhouse_data:
    driver: local

