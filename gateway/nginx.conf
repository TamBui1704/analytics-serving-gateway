# ============================================================
# API GATEWAY (NGINX THUẦN - NẤC 2)
# ============================================================
# Bản chất: Là một Reverse Proxy đứng ở cửa ngõ, đảm nhận 3 vai trò:
#   1. Routing: Chuyển request đến đúng backend service (FastAPI)
#   2. Edge Auth: Kiểm tra sự tồn tại của header X-API-Key
#   3. Rate Limiting: Chống spam/DDoS bằng thuật toán Leaky Bucket
# ============================================================

events {
    worker_connections 1024;
}

http {
    # ── RATE LIMITING CONFIGURATION ───────────────────────────
    # Tạo 1 vùng nhớ 'api_limit' (10MB lưu được khoảng 160.000 IP)
    # Giới hạn: Mỗi địa chỉ IP chỉ được gửi tối đa 5 requests / giây (5r/s)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    # Khi bị vượt quá rate limit, trả về HTTP 429 Too Many Requests (thay vì 503 mặc định)
    limit_req_status 429;

    upstream backend_api {
        # Tên service 'api_service' được Docker Compose tự động phân giải IP
        server api_service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # ── 1. ĐIỂM CHẶN: API Gateway Health Check ───────────────
        location /gateway/health {
            default_type application/json;
            return 200 '{"gateway": "ok", "role": "API Gateway (NGINX)"}\n';
        }

        # ── 2. ĐIỂM CHẶN: Forward vào Analytics API ──────────────
        location / {
            # Thiết lập content type mặc định cho location này
            default_type application/json;

            # --- TÍNH NĂNG 1: RATE LIMITING ---
            # Áp dụng vùng 'api_limit'
            # burst=2: Cho phép gửi dồn tối đa 2 request chờ xử lý
            # nodelay: Xử lý ngay, request thứ 3 dồn dập sẽ bị chặn 429 ngay lập tức
            limit_req zone=api_limit burst=2 nodelay;

            # --- TÍNH NĂNG 2: EDGE AUTHENTICATION ---
            # Nếu client không gửi header X-API-Key hoặc để trống
            # Chặn đứng tại đây, trả về 401 Unauthorized ngay!
            # (Request KHÔNG bao giờ chạm tới code FastAPI, tiết kiệm CPU/RAM)
            if ($http_x_api_key = "") {
                return 401 '{"error": "Unauthorized", "message": "API Gateway: Missing X-API-Key header"}\n';
            }

            # --- TÍNH NĂNG 3: ROUTING & REVERSE PROXY ---
            # Nếu vượt qua 2 bước kiểm tra trên, forward request vào FastAPI
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

