events {
    worker_connections 1024;
}

http {
    # ── 1. RATE LIMITING ZONE (Bảo vệ chống Spam / DDoS) ─────────
    # Giới hạn 10 req/s theo IP client, bộ nhớ theo dõi 10MB
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;

    upstream backend_api {
        server api_service:8000;
    }

    # ═════════════════════════════════════════════════════════════
    # SUBDOMAIN 1: analytics.local (HTTP :80 & HTTPS :443)
    # Nhiệm vụ: Chấm dứt SSL, Rate Limit, Điều hướng sang Analytics Service
    # ═════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen 443 ssl;
        server_name analytics.local localhost;

        # Cấu hình SSL / TLS
        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Áp dụng rate limiting: 10 req/s, burst 20 req
        limit_req zone=api_rate_limit burst=20 nodelay;

        # Chuẩn Production: Tắt access log cho các bài test probe để chống spam log
        location ~ ^/(healthz|readyz)$ {
            access_log off;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        location / {
            # Chuyển tiếp nguyên vẹn request (kèm Headers: Timestamp, Authorization) sang backend
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ═════════════════════════════════════════════════════════════
    # SUBDOMAIN 2: branding.local (HTTP :80 & HTTPS :443)
    # Nhiệm vụ: Chấm dứt SSL, Rate Limit, Điều hướng sang Branding Service
    # ═════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen 443 ssl;
        server_name branding.local;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        limit_req zone=api_rate_limit burst=20 nodelay;

        # Chuẩn Production: Tắt access log cho các bài test probe để chống spam log
        location ~ ^/(healthz|readyz)$ {
            access_log off;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
