events {
    worker_connections 1024;
}

http {
    # ── 1. MA TRẬN PHÂN QUYỀN KHÁCH HÀNG ─────────────────────────
    # Kiểm tra xem Key có quyền vào dịch vụ Analytics không?
    map $http_x_client_key $allow_analytics {
        default              0;
        "key_user_a"         1;  # Khách A được vào Analytics
        "key_user_vip"       1;  # Khách VIP được vào Analytics
    }

    # Kiểm tra xem Key có quyền vào dịch vụ Branding không?
    map $http_x_client_key $allow_branding {
        default              0;
        "key_user_b"         1;  # Khách B được vào Branding
        "key_user_vip"       1;  # Khách VIP được vào Branding
    }

    upstream backend_api {
        server api_service:8000;
    }

    # ═════════════════════════════════════════════════════════════
    # SUBDOMAIN 1: analytics.local (Trỏ vào FastAPI)
    # ═════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name analytics.local localhost;

        location / {
            default_type application/json;

            # Kiểm tra quyền vào Analytics
            if ($allow_analytics = 0) {
                return 403 '{"error": "Forbidden: You do not have access to Analytics service"}\n';
            }

            # NGINX tự đính kèm key nội bộ của FastAPI
            proxy_set_header X-API-Key "demo-key-123";

            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ═════════════════════════════════════════════════════════════
    # SUBDOMAIN 2: branding.local (Dịch vụ Branding giả lập)
    # ═════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name branding.local;

        location / {
            default_type application/json;

            # Kiểm tra quyền vào Branding
            if ($allow_branding = 0) {
                return 403 '{"error": "Forbidden: You do not have access to Branding service"}\n';
            }

            # Trả về kết quả demo của dịch vụ Branding
            return 200 '{"service": "Branding API", "status": "active", "message": "Welcome to Branding Hub!"}\n';
        }
    }
}
