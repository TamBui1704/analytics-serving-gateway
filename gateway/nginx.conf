events {
    worker_connections 1024;
}

http {
    # ── 0. HARDENING CƠ BẢN ──────────────────────────────────────
    server_tokens off;            # Ẩn phiên bản NGINX trong header Server
    client_max_body_size 1m;      # Chống gửi payload quá lớn làm tràn RAM

    # ── 1. RATE LIMITING ZONE (Bảo vệ chống Spam / DDoS) ─────────
    # Giới hạn 10 req/s theo IP client, bộ nhớ theo dõi 10MB
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;

    upstream backend_api {
        server api_service:8000;
    }

    # ═════════════════════════════════════════════════════════════
    # SUBDOMAIN 1: analytics.local (HTTP :80 & HTTPS :443)
    # Nhiệm vụ: SSL/TLS, Security Headers, Rate Limit, Chặn /metrics
    # ═════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen 443 ssl;
        server_name analytics.local localhost;

        # Cấu hình SSL / TLS
        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security Headers chuẩn Production
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Áp dụng rate limiting: 10 req/s, burst 20 req
        limit_req zone=api_rate_limit burst=20 nodelay;

        # BẢO MẬT (P0): Chặn truy cập /metrics từ bên ngoài (chỉ Prometheus nội bộ được scrape)
        location = /metrics {
            deny all;
            return 403;
        }

        # Chuẩn Production: Tắt access log cho các bài test probe để chống spam log
        location ~ ^/(healthz|readyz)$ {
            access_log off;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://backend_api;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }

    # ═════════════════════════════════════════════════════════════
    # SUBDOMAIN 2: branding.local (HTTP :80 & HTTPS :443)
    # Nhiệm vụ: SSL/TLS, Security Headers, Rate Limit, Chặn /metrics
    # ═════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen 443 ssl;
        server_name branding.local;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        limit_req zone=api_rate_limit burst=20 nodelay;

        # BẢO MẬT (P0): Chặn truy cập /metrics từ bên ngoài
        location = /metrics {
            deny all;
            return 403;
        }

        location ~ ^/(healthz|readyz)$ {
            access_log off;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://backend_api;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
