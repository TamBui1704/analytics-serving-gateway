events {
    worker_connections 1024;
}

http {
    # ── 1. RATE LIMITING ZONE (Bảo vệ chống DDoS / Brute Force) ──
    # Giới hạn 10 req/s theo IP client, bộ nhớ theo dõi 10MB
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;

    upstream backend_api {
        server api_service:8000;
    }

    # ═════════════════════════════════════════════════════════════
    # SUBDOMAIN 1: analytics.local (Trỏ vào FastAPI)
    # ═════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name analytics.local localhost;

        # Áp dụng rate limiting: tối đa 10 req/s, cho phép burst hàng đợi 20 req
        limit_req zone=api_rate_limit burst=20 nodelay;

        location / {
            default_type application/json;

            # 1. Edge Layer: Kiểm tra bắt buộc phải truyền API Key
            # (Hỗ trợ cả X-API-Key lẫn X-Client-Key)
            set $client_api_key $http_x_api_key;
            if ($client_api_key = "") {
                set $client_api_key $http_x_client_key;
            }

            if ($client_api_key = "") {
                return 401 '{"error": "Unauthorized: API Key is required (X-API-Key or X-Client-Key header)"}\n';
            }

            # 2. Chuyển tiếp key động của khách hàng vào backend FastAPI để backend thẩm định
            # (AN TOÀN: Tuyệt đối KHÔNG hardcode key bí mật trong file conf này)
            proxy_set_header X-API-Key $client_api_key;

            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ═════════════════════════════════════════════════════════════
    # SUBDOMAIN 2: branding.local (Dịch vụ Branding giả lập)
    # ═════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name branding.local;

        limit_req zone=api_rate_limit burst=20 nodelay;

        location / {
            default_type application/json;

            set $client_api_key $http_x_api_key;
            if ($client_api_key = "") {
                set $client_api_key $http_x_client_key;
            }

            if ($client_api_key = "") {
                return 401 '{"error": "Unauthorized: API Key is required"}\n';
            }

            return 200 '{"service": "Branding API", "status": "active", "message": "Welcome to Branding Hub!"}\n';
        }
    }
}
