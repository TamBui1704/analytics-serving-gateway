# monitoring/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Kết nối tới Alertmanager để gửi cảnh báo khi Alert Rule kích hoạt
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Danh sách file chứa quy tắc cảnh báo (Alert Rules)
rule_files:
  - /etc/prometheus/alert_rules.yml

# Danh sách dịch vụ Prometheus sẽ chủ động kéo (scrape) metrics định kỳ
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "analytics-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api_service:8000"]
        labels:
          service: "analytics-api"
          env: "local"

