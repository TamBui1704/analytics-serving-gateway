# k8s/ingress.yaml
# NGINX Ingress Controller — API Gateway L7 Routing (Phương án A: Tinh gọn)
#
# Nhiệm vụ của Ingress Controller:
#   ✅ Chấm dứt SSL/TLS (HTTPS)
#   ✅ Rate Limiting : 10 req/s per IP (chống Spam / DDoS)
#   ✅ Điều phối tên miền (Subdomain Routing):
#       - analytics.local -> Chuyển vào Service ClusterIP analytics-api-svc
#       - branding.local  -> Chuyển vào Service ClusterIP branding-api-svc
#   ✅ KHÔNG nhồi nhét logic Auth: Mỗi backend tự check sha256(key + timestamp)

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: analytics
  annotations:
    # ── Rate limiting (Chống Spam / DDoS ngay tại cửa ngõ) ────────────────────
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"

    # ── Chuyển hướng HTTP sang HTTPS ──────────────────────────────────────────
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # ── Cấu hình Timeout & Kích thước Request ─────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"

spec:
  # Chỉ định IngressClass (chuẩn K8s hiện đại >= 1.18)
  ingressClassName: nginx

  # Cấu hình chứng chỉ TLS/SSL (được tạo từ K8s Secret tls)
  tls:
    - hosts:
        - analytics.local
        - branding.local
      secretName: gateway-tls-secret

  rules:
    # ── 1. ĐIỀU PHỐI DỊCH VỤ ANALYTICS ────────────────────────────────────────
    - host: analytics.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: analytics-api-svc       # Service ClusterIP nội bộ của Analytics
                port:
                  number: 80

    # ── 2. ĐIỀU PHỐI DỊCH VỤ BRANDING ─────────────────────────────────────────
    - host: branding.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: branding-api-svc        # Service ClusterIP nội bộ của Branding
                port:
                  number: 80
