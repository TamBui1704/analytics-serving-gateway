# .github/workflows/ci-cd.yml
# ============================================================
# CI/CD Pipeline: Build → Test → Push → Deploy
#
# Trigger: push to main branch OR pull request to main
#
# Secrets required (set in GitHub repo Settings → Secrets):
#   KUBECONFIG_B64  : base64-encoded kubeconfig for your K8s cluster
#                     cat ~/.kube/config | base64 -w 0
#
# Image registry: GitHub Container Registry (GHCR) — free for public repos
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. username/analytics-serving-gateway

jobs:
  # ── Job 1: Lint & Test ────────────────────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api_app/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r api_app/requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: ruff check api_app/

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        # Tests run with mocked ClickHouse so no DB needed in CI

  # ── Job 2: Build & Push Docker image ─────────────────────────────────────────
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test                   # Only build if tests pass
    if: github.ref == 'refs/heads/main'   # Only on main branch (not PRs)
    permissions:
      contents: read
      packages: write             # Needed to push to GHCR

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Auto-provided by GitHub

      - name: Extract Docker image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-                  # e.g. sha-abc1234
            type=raw,value=latest,enable=true      # always tag :latest on main

      - name: Set up Docker Buildx (for multi-platform builds)
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha                    # GitHub Actions cache
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to Kubernetes ───────────────────────────────────────────────
  # Tạm tắt tự động Deploy từ GitHub vì cụm Minikube đang chạy trên máy local (không thể truy cập từ Internet).
  # GitHub Actions chỉ đóng vai trò CI (Test -> Build -> Push Image lên GHCR).
  # Khi nào bạn có cụm K8s Cloud thật (EKS/GKE), đổi thành: if: github.ref == 'refs/heads/main'
  deploy:
    name: 🚀 Deploy to K8s
    runs-on: ubuntu-latest
    needs: build
    if: false
    environment: production       # Requires manual approval (configure in GitHub)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Configure kubeconfig
        # Decode the base64 kubeconfig stored as a GitHub Secret
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connectivity
        run: kubectl cluster-info --request-timeout=10s

      - name: Apply K8s manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml   -n analytics
          if [ -f k8s/secret.yaml ]; then
            kubectl apply -f k8s/secret.yaml -n analytics
          else
            kubectl create secret generic analytics-gateway-secret \
              --from-literal=API_KEYS="${{ secrets.API_KEYS || 'demo-key-123,demo-key-456' }}" \
              --from-literal=CLICKHOUSE_HOST="${{ secrets.CLICKHOUSE_HOST || 'localhost' }}" \
              --from-literal=CLICKHOUSE_PASSWORD="${{ secrets.CLICKHOUSE_PASSWORD || '' }}" \
              -n analytics \
              --dry-run=client -o yaml | kubectl apply -f -
          fi
          kubectl apply -f k8s/api-deployment.yaml -n analytics
          kubectl apply -f k8s/api-service.yaml  -n analytics
          kubectl apply -f k8s/ingress.yaml      -n analytics
          kubectl apply -f k8s/network-policy.yaml -n analytics
          kubectl apply -f k8s/hpa.yaml          -n analytics

      - name: Update deployment image to new SHA
        run: |
          kubectl set image deployment/analytics-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            -n analytics

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/analytics-api \
            -n analytics --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -n analytics
          kubectl get ingress -n analytics

